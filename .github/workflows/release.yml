name: Release

# A push to main publishes a release when the version in Cargo.toml has no
# tag yet. Bumping that version is the only release step; the tag is made here.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Pushes queue up instead of racing. A later run for a version that was just
# released finds its tag and skips.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    # A manual run can pick any branch. Only main is released.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ -z "$version" ]; then
            echo "Cargo.toml has no version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "releasing v$version"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: Zip
        shell: pwsh
        run: |
          $url = (Select-String -Path packaging/sources.env -Pattern '^FFMPEG_WINDOWS_URL=(.+)$').Matches[0].Groups[1].Value
          $src = Join-Path $env:RUNNER_TEMP "ffmpeg-src"
          New-Item -ItemType Directory -Force $src | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "$src/ffmpeg.zip"
          Expand-Archive "$src/ffmpeg.zip" -DestinationPath "$src/out"
          $ffmpeg = Get-ChildItem -Recurse "$src/out" -Filter ffmpeg.exe | Where-Object { $_.FullName -match '\\bin\\ffmpeg\.exe$' } | Select-Object -First 1
          if (-not $ffmpeg) { throw "the ffmpeg archive had no bin/ffmpeg.exe" }
          $pack = "dist/strix-lc-screen"
          New-Item -ItemType Directory -Force $pack | Out-Null
          Copy-Item target/release/strix-lc-screen.exe $pack/
          Copy-Item $ffmpeg.FullName (Join-Path $pack "ffmpeg.exe")
          Copy-Item packaging/FFMPEG.txt $pack/
          Copy-Item assets/fonts/OFL.txt (Join-Path $pack "FONT-LICENSE.txt")
          Compress-Archive -Path $pack -DestinationPath dist/strix-lc-screen-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/strix-lc-screen-windows-x86_64.zip

  linux:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcb1-dev libxcursor-dev libxi-dev \
            libxrandr-dev libgl1-mesa-dev dpkg-dev
      - name: Build
        run: cargo build --release --locked
      - name: Bundle ffmpeg
        run: ./packaging/fetch-ffmpeg.sh
      - name: Tarball
        run: |
          mkdir -p dist/strix-lc-screen
          cp target/release/strix-lc-screen packaging/ffmpeg packaging/FFMPEG.txt \
            linux/60-strix-lc-screen.rules dist/strix-lc-screen/
          cp assets/fonts/OFL.txt dist/strix-lc-screen/FONT-LICENSE.txt
          chmod 755 dist/strix-lc-screen/strix-lc-screen dist/strix-lc-screen/ffmpeg
          tar -C dist -czf dist/strix-lc-screen-linux-x86_64.tar.gz strix-lc-screen
      - name: Debian package
        run: |
          cargo install cargo-deb --version 3.6.4 --locked
          cargo deb --no-build
          mkdir -p dist
          cp target/debian/strix-lc-screen_*.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/strix-lc-screen-linux-x86_64.tar.gz
            dist/strix-lc-screen_*.deb

  publish:
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: sed "s/{{version}}/$VERSION/g" .github/release-notes.md > dist/release-notes.md
      # Creates the tag on the commit that was built.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true
          make_latest: true
          files: |
            dist/strix-lc-screen-windows-x86_64.zip
            dist/strix-lc-screen-linux-x86_64.tar.gz
            dist/strix-lc-screen_*.deb
