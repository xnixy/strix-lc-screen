[package]
name = "strix-lc-screen"
version = "0.4.0"
edition = "2021"
description = "Controller for the ROG Strix LC IV pump screen"
license = "MIT"
repository = "https://github.com/xnixy/strix-lc-screen"
readme = "README.md"

[[bin]]
name = "strix-lc-screen"
path = "src/main.rs"

[dependencies]
# Draws the stats panel text.
ab_glyph = "0.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Linux must use hidraw. The libusb backend does not report usage page, so the
# pump's vendor interface (0xFF00 / 0x0001) would be invisible.
hidapi = { version = "2", default-features = false, features = ["linux-static-hidraw"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The egui window. Linux uses GTK instead.
[target.'cfg(windows)'.dependencies]
eframe = "0.31"
rfd = "0.15"
tray-icon = "0.20"
winreg = "0.55"

# GTK 4.14 and libadwaita 1.5 are what Ubuntu 24.04 ships, the oldest system
# the release build supports. Newer API stays behind these feature flags.
[target.'cfg(target_os = "linux")'.dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
ksni = { version = "0.3", features = ["blocking"] }

[package.metadata.deb]
maintainer = "xnixy <x@ruxn.com>"
copyright = "2026 xnixy"
license-file = ["LICENSE", "0"]
extended-description = """\
Drives the pump screen on a ROG Strix LC IV cooler.
Photos and short videos are sent as JPEG frames while this program is running.
ffmpeg is included."""
depends = "libc6 (>= 2.39), libudev1 (>= 183), libgtk-4-1 (>= 4.14), libadwaita-1-0 (>= 1.5)"
recommends = "xdg-desktop-portal"
section = "utils"
priority = "optional"
revision = ""
maintainer-scripts = "debian"
assets = [
    "$auto",
    ["linux/60-strix-lc-screen.rules", "usr/lib/udev/rules.d/60-strix-lc-screen.rules", "644"],
    ["linux/strix-lc-screen.desktop", "usr/share/applications/strix-lc-screen.desktop", "644"],
    ["assets/icon.svg", "usr/share/icons/hicolor/scalable/apps/strix-lc-screen.svg", "644"],
    ["packaging/ffmpeg", "usr/lib/strix-lc-screen/ffmpeg", "755"],
    ["packaging/FFMPEG.txt", "usr/share/doc/strix-lc-screen/ffmpeg.txt", "644"],
    ["assets/fonts/OFL.txt", "usr/share/doc/strix-lc-screen/font-license.txt", "644"],
]

# Fedora and other RPM distributions. Built with cargo-generate-rpm.
[package.metadata.generate-rpm]
release = "1"
assets = [
    { source = "target/release/strix-lc-screen", dest = "/usr/bin/strix-lc-screen", mode = "755" },
    { source = "linux/60-strix-lc-screen.rules", dest = "/usr/lib/udev/rules.d/60-strix-lc-screen.rules", mode = "644" },
    { source = "linux/strix-lc-screen.desktop", dest = "/usr/share/applications/strix-lc-screen.desktop", mode = "644" },
    { source = "assets/icon.svg", dest = "/usr/share/icons/hicolor/scalable/apps/strix-lc-screen.svg", mode = "644" },
    { source = "packaging/ffmpeg", dest = "/usr/lib/strix-lc-screen/ffmpeg", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/licenses/strix-lc-screen/LICENSE", mode = "644" },
    { source = "packaging/FFMPEG.txt", dest = "/usr/share/doc/strix-lc-screen/ffmpeg.txt", mode = "644", doc = true },
    { source = "assets/fonts/OFL.txt", dest = "/usr/share/doc/strix-lc-screen/font-license.txt", mode = "644", doc = true },
]
# $1 is 0 only when the package is removed, not when it is upgraded.
post_install_script = """
if command -v udevadm >/dev/null 2>&1; then
    udevadm control --reload-rules || true
    udevadm trigger --subsystem-match=hidraw || true
fi
"""
post_uninstall_script = """
if [ "$1" -eq 0 ] && command -v udevadm >/dev/null 2>&1; then
    udevadm control --reload-rules || true
fi
"""

[package.metadata.generate-rpm.recommends]
xdg-desktop-portal = "*"
